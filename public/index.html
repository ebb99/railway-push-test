<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Push-Zentrale</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #10b981;
            --secondary-hover: #059669;
            --border-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f8fafc;
                --border-color: #334155;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background-color: transparent;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background-color: var(--primary-color);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
        .btn-primary:active { background-color: var(--primary-hover); transform: scale(0.98); }

        .btn-secondary {
            background-color: var(--secondary-color);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4);
        }
        .btn-secondary:active { background-color: var(--secondary-hover); transform: scale(0.98); }

        button:disabled {
            background-color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- BOX 1: SMARTPHONE REGISTRIEREN -->
    <div class="card">
        <h2>1. Smartphone registrieren</h2>
        <p>Trage deinen Namen ein, um Benachrichtigungen für dieses Handy zu aktivieren.</p>
        
        <div class="form-group">
            <label for="reg-username">Dein Name</label>
            <input type="text" id="reg-username" placeholder="z.B. Eddi" autocomplete="off">
        </div>

        <button id="register-btn" class="btn-primary">Aktivieren</button>
        <div id="reg-status" class="status-msg"></div>
    </div>

    <!-- BOX 2: PUSH-NACHRICHT DIREKT SENDEN -->
    <div class="card">
        <h2>2. Push-Nachricht senden</h2>
        <p>Sende von hier aus direkt eine Nachricht an ein registriertes Smartphone.</p>
        
        <div class="form-group">
            <label for="send-target">Empfänger-Name (leer lassen für ALLE)</label>
            <input type="text" id="send-target" placeholder="z.B. Eddi" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="send-text">Nachrichtstext</label>
            <input type="text" id="send-text" placeholder="Deine Nachricht..." autocomplete="off">
        </div>

        <button id="send-btn" class="btn-secondary">Nachricht senden</button>
        <div id="send-status" class="status-msg"></div>
    </div>

    <script>
        // HIER DEINEN GENERIERTEN ÖFFENTLICHEN VAPID-SCHLÜSSEL EINTRAGEN
        const publicVapidKey = 'BHGV74UuIiP2EEqlozOGoC-4WcCtndI5TdMcU3_MqcbaFB8nLynSgQva3JUoA_HJE5HaNmOm1jlVSwtaIVpkiuM';
        
        // Elemente für Registrierung
        const regButton = document.getElementById('register-btn');
        const regUsernameInput = document.getElementById('reg-username');
        const regStatusDiv = document.getElementById('reg-status');

        // Elemente für Senden
        const sendButton = document.getElementById('send-btn');
        const sendTargetInput = document.getElementById('send-target');
        const sendTextInput = document.getElementById('send-text');
        const sendStatusDiv = document.getElementById('send-status');

        // LOGIK 1: SMARTPHONE REGISTRIEREN
        regButton.addEventListener('click', async () => {
            const name = regUsernameInput.value.trim();
            if (!name) {
                alert('Bitte gib zuerst deinen Namen ein!');
                return;
            }

            regStatusDiv.style.color = 'var(--primary-color)';
            regStatusDiv.textContent = 'Registrierung läuft...';

            if ('serviceWorker' in navigator) {
                try {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') {
                        regStatusDiv.style.color = '#ef4444';
                        regStatusDiv.textContent = 'Berechtigung verweigert.';
                        return;
                    }

                    const register = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
                    const subscription = await register.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                    });

                    const response = await fetch('/subscribe', {
                        method: 'POST',
                        body: JSON.stringify({ subscription, username: name }),
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        regStatusDiv.style.color = '#10b981';
                        regStatusDiv.textContent = `Erfolgreich als "${name}" registriert!`;
                        regUsernameInput.disabled = true;
                        regButton.disabled = true;
                    } else {
                        regStatusDiv.style.color = '#ef4444';
                        regStatusDiv.textContent = 'Server-Fehler beim Speichern.';
                    }
                } catch (err) {
                    console.error(err);
                    regStatusDiv.style.color = '#ef4444';
                    regStatusDiv.textContent = 'Fehler bei der Registrierung.';
                }
            }
        });

        // LOGIK 2: PUSH-NACHRICHT AUS DER FORMULAR-BOX SENDEN
        sendButton.addEventListener('click', async () => {
            const target = sendTargetInput.value.trim();
            const text = sendTextInput.value.trim();

            if (!text) {
                alert('Bitte gib einen Nachrichtstext ein!');
                return;
            }

            sendStatusDiv.style.color = 'var(--text-color)';
            sendStatusDiv.textContent = 'Sende...';

            try {
                let url = `/trigger-push?text=${encodeURIComponent(text)}`;
                if (target) {
                    url += `&user=${encodeURIComponent(target)}`;
                }

                const response = await fetch(url);
                const responseText = await response.text();

                if (response.ok) {
                    sendStatusDiv.style.color = '#10b981';
                    sendStatusDiv.textContent = responseText;
                    sendTextInput.value = '';
                } else {
                    sendStatusDiv.style.color = '#ef4444';
                    sendStatusDiv.textContent = responseText;
                }
            } catch (err) {
                console.error(err);
                sendStatusDiv.style.color = '#ef4444';
                sendStatusDiv.textContent = 'Verbindungsfehler zum Server.';
            }
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
</body>
</html>
